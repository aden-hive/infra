[supervisord]
nodaemon=true
logfile=NONE
logfile_maxbytes=0
logfile_backups=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -nopw -noxdamage -quiet
autorestart=true
priority=20
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify.err

[program:crxserver]
command=/usr/bin/python3 -m http.server --directory /opt/hive-ext-crx --bind 127.0.0.1 9999
autorestart=true
priority=35
stdout_logfile=/tmp/crxserver.log
stderr_logfile=/tmp/crxserver.err

[program:hive]
; Invoke the venv's hive script directly. `uv run` does a runtime
; lockfile/venv consistency check and re-syncs on any drift, which can
; add 10-30s to startup and pushed the orchestrator's 20s snapshot
; deadline past hive serve's port bind. The venv is already fully
; resolved at image build time (Dockerfile: `uv sync --frozen`).
command=/opt/hive/.venv/bin/hive serve --host 0.0.0.0 --port 8787
directory=/opt/hive
autorestart=true
startretries=5
priority=40
stdout_logfile=/tmp/hive.log
stderr_logfile=/tmp/hive.err

[program:chrome]
command=/usr/local/bin/start-chrome.sh
environment=DISPLAY=":1",HOME="/home/hive"
autorestart=true
priority=50
stdout_logfile=/tmp/chrome.log
stderr_logfile=/tmp/chrome.err
