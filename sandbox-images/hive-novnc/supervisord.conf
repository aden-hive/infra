[supervisord]
nodaemon=true
logfile=NONE
logfile_maxbytes=0
logfile_backups=0
pidfile=/tmp/supervisord.pid
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -nopw -noxdamage -quiet
autorestart=true
priority=20
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30
stdout_logfile=/tmp/websockify.log
stderr_logfile=/tmp/websockify.err

; XFCE4 desktop environment. Three programs (no full xfce4-session)
; because supervisord doesn't share a DBUS session bus across children
; — running each component directly avoids the dbus-launch dance and
; lets supervisord supervise each piece independently (a panel crash
; doesn't kill the WM, etc.). xfwm4 must be priority 31 so windows
; have a manager BEFORE chrome maps a top-level at priority 50.
[program:xfwm4]
command=/usr/bin/xfwm4 --replace
environment=DISPLAY=":1",HOME="/root"
autorestart=true
priority=31
startretries=10
stdout_logfile=/tmp/xfwm4.log
stderr_logfile=/tmp/xfwm4.err

; xfsettingsd — XSETTINGS manager. Without it running, GTK clients
; (including xfce4-panel for launcher icons) only read GTK config from
; ~/.config/gtk-3.0/settings.ini once at startup; runtime xfconf changes
; to /Net/IconThemeName, /Gtk/FontName etc never propagate. The user
; hit this directly: live xfconf-query writes to xsettings were ignored
; and the dock launchers stayed on stock Adwaita icons regardless of
; how many times we set Papirus-Dark. xfsettingsd has to be running
; BEFORE xfce4-panel boots so the panel reads the broadcast theme on
; its first paint, hence priority 31 (just under panel's 32).
[program:xfsettingsd]
command=/usr/bin/xfsettingsd --display=:1
environment=DISPLAY=":1",HOME="/root"
autorestart=true
priority=31
startretries=10
stdout_logfile=/tmp/xfsettingsd.log
stderr_logfile=/tmp/xfsettingsd.err

[program:xfce4-panel]
command=/usr/bin/xfce4-panel --disable-wm-check
environment=DISPLAY=":1",HOME="/root"
autorestart=true
priority=32
startretries=10
stdout_logfile=/tmp/xfce4-panel.log
stderr_logfile=/tmp/xfce4-panel.err

[program:xfdesktop]
command=/usr/bin/xfdesktop --disable-wm-check
environment=DISPLAY=":1",HOME="/root"
autorestart=true
priority=33
startretries=10
stdout_logfile=/tmp/xfdesktop.log
stderr_logfile=/tmp/xfdesktop.err

; OpenHive branding applier — one-shot at boot, after Xvfb + xfdesktop +
; xfce4-panel + xfwm4 are up. Owns five surfaces: desktop wallpaper,
; xfwm4 window decorations (Greybird-dark), xfce4-panel chrome (charcoal),
; xsettings GTK theme, and clock + users-plugin layout. xfconf-query
; needs a live DBus session + X display so this can't run at image-build
; time. autorestart=false because the script is idempotent and self-
; terminating; partial failure is logged but doesn't crash anything else.
; priority is higher than xfdesktop's 33 + xfce4-panel's 31 so this
; fires AFTER both are already accepting xfconf writes.
[program:hive-branding]
command=/opt/hive-branding/apply-branding.sh
environment=DISPLAY=":1",HOME="/root"
autorestart=false
autostart=true
startsecs=0
priority=40
stdout_logfile=/tmp/hive-branding.log
stderr_logfile=/tmp/hive-branding.err

[program:crxserver]
command=/usr/bin/python3 -m http.server --directory /opt/hive-ext-crx --bind 127.0.0.1 9999
autorestart=true
priority=35
stdout_logfile=/tmp/crxserver.log
stderr_logfile=/tmp/crxserver.err

; Branding HTTP server — serves /opt/hive-branding/newtab.html (+ its
; referenced assets: hive-mark.svg, hex-watermark.svg) on port 9998.
;
; Why not file:// ? The hive-browser-bridge extension declares <all_urls>
; permission which transparently covers http://localhost but does NOT
; cover file:// without the user toggling "Allow access to file URLs"
; per-extension in chrome://extensions. file:// new-tab caused the
; bridge to surface a "file permission required" notice on every new
; tab. Serving over http://127.0.0.1:9998/ from this loopback-only
; python http.server sidesteps that entire category of permission
; prompt while staying offline-safe (no egress dependency).
[program:branding-http]
command=/usr/bin/python3 -m http.server --directory /opt/hive-branding --bind 127.0.0.1 9998
autorestart=true
priority=36
stdout_logfile=/tmp/branding-http.log
stderr_logfile=/tmp/branding-http.err

[program:hive]
; LLM provider env (KIMI_API_KEY) is baked into the image as a Docker
; ENV — see Dockerfile. supervisord inherits it from systemd, and so
; does this hive serve child. e2b's spawn-time envVars do NOT reach
; here (they only apply to envd-spawned processes), but for staging
; we use a single shared key per template build. See Dockerfile note.
;
; oom_score_adj=-800: protect hive serve from the kernel OOM killer.
; Under real memory pressure the kernel picks the process with the
; HIGHEST oom_score (rss-derived + oom_score_adj, clamped to [0,1000])
; as its victim. Hive serve dying takes both /api and, indirectly,
; the noVNC bridge with it (an ~11s 502 window observed 2026-07-01).
; Setting the adj strongly negative pushes hive serve to the bottom
; of the victim list — Chrome renderers (+700 below) get killed
; first, and Chrome recovers by auto-restoring the affected tab.
; Range: [-1000, +1000]. -800 leaves headroom to still kill hive
; serve if EVERY other process is already gone (i.e. the VM is
; actually unrecoverable), rather than making it truly OOM-immune.
;
; Children inherit oom_score_adj from parent at fork, so hive serve's
; MCP subprocesses, GCU bridge, etc. all get -800 too. That's fine —
; a partial kill of an MCP subprocess is more disruptive than the
; killed-Chrome-tab case; Chrome degrades gracefully, an MCP server
; dying mid-tool-call surfaces to the queen as an error.
command=/bin/bash -c "echo -800 > /proc/self/oom_score_adj; exec /opt/hive/.venv/bin/hive serve --host 0.0.0.0 --port 8787"
directory=/opt/hive
autorestart=true
startretries=5
priority=40
stdout_logfile=/tmp/hive.log
stderr_logfile=/tmp/hive.err

[program:chrome]
; Chrome memory isolation is done INSIDE start-chrome.sh via a cgroup v2
; slice (chrome.slice, memory.max=2 GiB) rather than kernel-wide oom_score_adj.
;
; History: we previously set oom_score_adj=+700 here. That adj was inherited
; by every Chrome child including the browser process. Under any memory
; pressure the kernel picked the highest-scored process, which was often the
; RENDERER of a tab still being created (allocation burst during startup
; raised its rss, and adj=+700 tipped it to top-of-list). The tab died
; mid-spawn, the browser-bridge extension retried, cycle repeated —
; reported by user 2026-07-01 as "tab creates but immediately dies, group
; IDs keep cycling"; app restart did NOT recover because it was purely
; VM-side kernel behavior.
;
; Replacement: memory.max on a Chrome-only cgroup gives us the same
; "renderers die, hive serve doesn't" property WITHOUT racing at OS scale.
; When Chrome exceeds the ceiling, the kernel picks a victim inside the
; slice (typically a big renderer, since the browser proc has the smallest
; RSS of the chrome-* procs). hive serve stays on adj=-800 to remain the
; last-picked victim in the rare true-VM-OOM case.
command=/usr/local/bin/start-chrome.sh
environment=DISPLAY=":1",HOME="/home/hive"
autorestart=true
priority=50
stdout_logfile=/tmp/chrome.log
stderr_logfile=/tmp/chrome.err
