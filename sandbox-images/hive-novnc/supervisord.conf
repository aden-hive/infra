[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -rfbport 5900 -nopw -noxdamage -quiet
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/websockify.log
stderr_logfile=/var/log/supervisor/websockify.err

[program:crxserver]
command=/usr/bin/python3 -m http.server --directory /opt/hive-ext-crx --bind 127.0.0.1 9999
autorestart=true
priority=35
stdout_logfile=/var/log/supervisor/crxserver.log
stderr_logfile=/var/log/supervisor/crxserver.err

[program:hive]
command=/usr/local/bin/uv run --project /opt/hive hive serve --host 0.0.0.0 --port 8787
directory=/opt/hive
autorestart=true
startretries=5
priority=40
stdout_logfile=/var/log/supervisor/hive.log
stderr_logfile=/var/log/supervisor/hive.err

[program:chrome]
command=/usr/local/bin/start-chrome.sh
user=hive
environment=DISPLAY=":1",HOME="/home/hive"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome.err
