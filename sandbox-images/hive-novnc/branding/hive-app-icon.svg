      <polygon points="32,35 37.2,38 37.2,44 32,47 26.8,44 26.8,38"/>
      <polygon points="20,28 25.2,31 25.2,37 20,40 14.8,37 14.8,31"/>
      <polygon points="32,21 37.2,24 37.2,30 32,33 26.8,30 26.8,24"/>
    </g>
