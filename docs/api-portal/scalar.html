<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hive VM control · Scalar reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Scalar injects its own UI; give it the whole viewport. */
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0f15; color: #e6edf3; font-family: system-ui, sans-serif; }
  /* Loading hint visible until Scalar's bundle paints. */
  #scalar-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #5d6b7d; font-size: 13px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="scalar-loading">Loading API reference…</div>

<!--
  Scalar API Reference — the documented embed pattern:
  the script tag with id="api-reference" + data-url is the mount point,
  and the loader script (second) replaces it with the rendered UI.
  Spec is loaded relative to this file, so it works on file:// + http://.
-->
<script
  id="api-reference"
  type="application/json"
  data-url="openapi.yaml"
>
{
  "theme": "deepSpace",
  "layout": "modern",
  "hideClientButton": false,
  "defaultHttpClient": { "targetKey": "shell", "clientKey": "curl" }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
<script>
  // Once Scalar's DOM lands, kill the loading hint.
  const obs = new MutationObserver(() => {
    if (document.body.children.length > 2) {
      const el = document.getElementById("scalar-loading");
      if (el) el.remove();
      obs.disconnect();
    }
  });
  obs.observe(document.body, { childList: true });
  // Hard timeout — if Scalar's CDN is blocked or the spec failed to parse,
  // surface the error instead of hanging at "Loading…".
  setTimeout(() => {
    const el = document.getElementById("scalar-loading");
    if (el && document.body.children.length <= 2) {
      el.innerHTML =
        'Scalar failed to load. ' +
        'Check the browser console for errors, or open ' +
        '<a href="openapi.yaml" style="color:#58a6ff;">openapi.yaml</a> directly.';
      el.style.pointerEvents = "auto";
    }
  }, 8000);
</script>
</body>
</html>
